<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPecker — Master Chess Openings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23D4AF37%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 2v3M10 3.5h4%22/><path d=%22M12 5c-2 0-3.5 1.5-3.5 3.5 0 1.5 1 3 2.5 3.5V15H8v2h8v-2h-3v-3c1.5-.5 2.5-2 2.5-3.5 0-2-1.5-3.5-3.5-3.5z%22/><path d=%22M9 19h6%22/><path d=%22M8 22h8%22/></svg>">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.background = 'white';
        div.style.padding = '20px';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.zIndex = '9999';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.overflow = 'auto';
        div.innerHTML = '<h1>Global Error Caught</h1>' +
                        '<p><b>Message:</b> ' + message + '</p>' +
                        '<p><b>Source:</b> ' + source + '</p>' +
                        '<p><b>Line:</b> ' + lineno + '</p>' +
                        '<p><b>Column:</b> ' + colno + '</p>' +
                        '<pre>' + (error && error.stack ? error.stack : 'No stack trace') + '</pre>';
        document.body.appendChild(div);
      };
      window.onunhandledrejection = function(event) {
        var div = document.createElement('div');
        div.style.color = 'orange';
        div.style.background = 'white';
        div.style.padding = '20px';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.zIndex = '9999';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.overflow = 'auto';
        div.innerHTML = '<h1>Unhandled Promise Rejection</h1>' +
                        '<p><b>Reason:</b> ' + event.reason + '</p>';
        document.body.appendChild(div);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
